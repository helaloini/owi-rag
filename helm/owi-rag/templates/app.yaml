apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      containers:
        - name: api
          image: {{ .Values.image }}
          ports: [{ containerPort: 8000 }]
          env:
            - { name: OWI_LLM_URL, value: {{ .Values.llmUrl | quote }} }
            - { name: OWI_LLM_MODEL, value: {{ .Values.llmModel | quote }} }
          volumeMounts: [{ name: data, mountPath: /app/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ .Values.dataClaim }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: { app: {{ .Release.Name }} }
  ports: [{ port: 80, targetPort: 8000 }]
